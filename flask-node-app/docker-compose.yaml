version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./shared-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:5000
    volumes:
      - ./shared-data:/usr/src/app/data   # Access data.json from here in Express
    depends_on:
      - backend
