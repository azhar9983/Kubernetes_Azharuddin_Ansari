<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask-Node Submission Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .form-container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007BFF; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #response-box { margin-top: 20px; padding: 15px; display: none; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>User Registration Form</h2>
    <form id="userForm">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit">Submit to Backend</button>
    </form>

    <div id="response-box" role="status" aria-live="polite"></div>
</div>

<script>
    const userForm = document.getElementById('userForm');
    const responseBox = document.getElementById('response-box');
    const submitButton = userForm.querySelector('button[type="submit"]');

    userForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Stop standard page reload submission

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        submitButton.disabled = true;

        try {
            const response = await fetch('/api/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, email })
            });
            const data = await response.json().catch(() => ({}));

            responseBox.style.display = 'block';
            if (response.ok) {
                responseBox.className = 'success';
                responseBox.innerText = data.message || 'Your submission was processed.';
            } else {
                responseBox.className = 'error';
                responseBox.innerText = 'Error: ' + (data.message || 'The submission failed.');
            }
        } catch {
            responseBox.style.display = 'block';
            responseBox.className = 'error';
            responseBox.innerText = 'Could not connect to the Node server. Is it running?';
        } finally {
            submitButton.disabled = false;
        }
    });
</script>

</body>
</html>
